<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>认识一个月 🌙</title>
  <script src="letter.js"></script>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    :root {
      --pink: #ff6b9d;
      --purple: #c44dff;
      --blue: #4d79ff;
      --gold: #ffd700;
      /* 昼夜主题变量 */
      --sky-top: #060612;
      --sky-bot: #0a0820;
      --stars-op: 1;
      --theme-c1: #ff6b9d;
      --theme-c2: #c44dff;
      --theme-c3: #4d79ff;
    }

    html, body {
      width: 100%;
      min-height: 100%;
      overflow-x: hidden;
    }

    body {
      background: linear-gradient(180deg, var(--sky-top) 0%, var(--sky-bot) 100%);
      background-attachment: fixed;
      transition: background 8s ease;
      font-family: 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif;
      color: #fff;
    }

    /* ── 粒子画布 ── */
    #particle-canvas {
      position: fixed;
      inset: 0;
      z-index: 0;
      pointer-events: none;
    }

    /* ── 流星 ── */
    .shooting-stars {
      position: fixed;
      inset: 0;
      z-index: 1;
      pointer-events: none;
      overflow: hidden;
      opacity: var(--stars-op);
      transition: opacity 8s ease;
    }

    .star {
      position: absolute;
      width: 2px;
      height: 2px;
      background: #fff;
      border-radius: 50%;
      animation: twinkle var(--d, 3s) var(--delay, 0s) infinite ease-in-out;
      top: var(--top);
      left: var(--left);
      opacity: var(--opacity, 0.7);
    }

    @keyframes twinkle {
      0%, 100% { opacity: var(--opacity, 0.7); transform: scale(1); }
      50%       { opacity: 0.1; transform: scale(0.4); }
    }

    .meteor {
      position: absolute;
      top: var(--top);
      left: var(--left);
      width: 120px;
      height: 1px;
      background: linear-gradient(90deg, rgba(255,255,255,0), #fff);
      border-radius: 1px;
      transform: rotate(-35deg);
      animation: meteor var(--dur, 2s) var(--delay, 0s) infinite linear;
      opacity: 0;
    }

    @keyframes meteor {
      0%   { opacity: 0; transform: rotate(-35deg) translateX(0); }
      5%   { opacity: 1; }
      80%  { opacity: 0.8; }
      100% { opacity: 0; transform: rotate(-35deg) translateX(600px); }
    }

    /* ── 主内容 ── */
    .page {
      position: relative;
      z-index: 10;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 40px 20px 80px;
    }

    /* ── 光晕 ── */
    .glow-ring {
      position: relative;
      width: min(280px, 70vw);
      height: min(280px, 70vw);
      margin-bottom: 40px;
    }

    .glow-ring::before,
    .glow-ring::after {
      content: '';
      position: absolute;
      inset: -10px;
      border-radius: 50%;
      background: conic-gradient(var(--theme-c1), var(--theme-c2), var(--theme-c3), var(--theme-c1));
      animation: spin 4s linear infinite;
    }

    .glow-ring::after {
      inset: -20px;
      opacity: 0.35;
      filter: blur(12px);
      animation-direction: reverse;
      animation-duration: 6s;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    .glow-ring-inner {
      position: absolute;
      inset: 6px;
      border-radius: 50%;
      background: radial-gradient(circle at 40% 35%, #1a0a2e 0%, #0a0a1a 70%);
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }

    .moon-emoji {
      font-size: min(100px, 24vw);
      animation: float 3s ease-in-out infinite;
      filter: drop-shadow(0 0 20px rgba(255, 215, 0, 0.6));
    }

    @keyframes float {
      0%, 100% { transform: translateY(0) rotate(-5deg); }
      50%       { transform: translateY(-14px) rotate(5deg); }
    }

    /* ── 标题 ── */
    .title {
      font-size: clamp(28px, 7vw, 52px);
      font-weight: 900;
      text-align: center;
      background: linear-gradient(135deg, var(--pink) 0%, var(--purple) 50%, var(--blue) 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      margin-bottom: 20px;
      animation: fadeSlideUp 1s ease both;
      letter-spacing: 2px;
    }

    .subtitle {
      font-size: clamp(14px, 3.5vw, 18px);
      color: rgba(255,255,255,0.55);
      text-align: center;
      margin-bottom: 50px;
      animation: fadeSlideUp 1s 0.2s ease both;
      letter-spacing: 1px;
    }

    @keyframes fadeSlideUp {
      from { opacity: 0; transform: translateY(30px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    /* ── 计时器 ── */
    .timer-section {
      display: flex;
      gap: clamp(6px, 2vw, 18px);
      margin-bottom: 28px;
      animation: fadeSlideUp 1s 0.4s ease both;
      flex-wrap: nowrap;
    }

    .timer-block {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 8px;
    }

    .timer-num {
      width: clamp(48px, 13vw, 80px);
      height: clamp(48px, 13vw, 80px);
      border-radius: 16px;
      background: rgba(255,255,255,0.05);
      border: 1px solid rgba(255,255,255,0.12);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: clamp(18px, 4.5vw, 34px);
      font-weight: 700;
      color: #fff;
      position: relative;
      overflow: hidden;
      backdrop-filter: blur(8px);
    }

    .timer-num::before {
      content: '';
      position: absolute;
      inset: 0;
      background: linear-gradient(135deg, rgba(255,107,157,0.15), rgba(196,77,255,0.15));
    }

    .timer-num span {
      position: relative;
      z-index: 1;
    }

    .timer-colon {
      font-size: clamp(18px, 4.5vw, 34px);
      font-weight: 700;
      color: rgba(255,255,255,0.4);
      align-self: flex-start;
      padding-top: clamp(10px, 2.5vw, 20px);
      animation: blink 1s step-end infinite;
    }

    @keyframes blink {
      50% { opacity: 0; }
    }

    .timer-label {
      font-size: clamp(10px, 2.5vw, 13px);
      color: rgba(255,255,255,0.4);
      letter-spacing: 1px;
    }

    /* ── 卡片网格 ── */
    .cards {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: clamp(12px, 3vw, 20px);
      width: 100%;
      max-width: 560px;
      margin-bottom: 56px;
      animation: fadeSlideUp 1s 0.6s ease both;
    }

    .card {
      background: rgba(255,255,255,0.04);
      border: 1px solid rgba(255,255,255,0.08);
      border-radius: 20px;
      padding: clamp(18px, 4vw, 28px) clamp(14px, 3vw, 22px);
      text-align: center;
      position: relative;
      overflow: hidden;
      transition: transform 0.3s, box-shadow 0.3s;
      cursor: default;
      backdrop-filter: blur(6px);
    }

    .card:hover, .card:active {
      transform: translateY(-5px) scale(1.02);
      box-shadow: 0 12px 40px rgba(196, 77, 255, 0.25);
    }

    .card::before {
      content: '';
      position: absolute;
      inset: 0;
      background: var(--card-grad, linear-gradient(135deg, rgba(255,107,157,0.1), rgba(196,77,255,0.05)));
      opacity: 0;
      transition: opacity 0.3s;
    }

    .card:hover::before, .card:active::before { opacity: 1; }

    .card-icon {
      font-size: clamp(28px, 7vw, 42px);
      margin-bottom: 10px;
      display: block;
      animation: iconBounce 2s ease-in-out infinite;
    }

    .card:nth-child(2) .card-icon { animation-delay: 0.3s; }
    .card:nth-child(3) .card-icon { animation-delay: 0.6s; }
    .card:nth-child(4) .card-icon { animation-delay: 0.9s; }

    @keyframes iconBounce {
      0%, 100% { transform: translateY(0); }
      50%       { transform: translateY(-6px); }
    }

    .card-title {
      font-size: clamp(12px, 3vw, 15px);
      color: rgba(255,255,255,0.5);
      margin-bottom: 6px;
      letter-spacing: 0.5px;
    }

    .card-value {
      font-size: clamp(20px, 5vw, 30px);
      font-weight: 700;
      background: linear-gradient(135deg, var(--pink), var(--purple));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    /* ── 按钮行 ── */
    .btn-row {
      display: flex;
      gap: clamp(10px, 3vw, 18px);
      flex-wrap: wrap;
      justify-content: center;
      animation: fadeSlideUp 1s 0.8s ease both;
      margin-bottom: 20px;
    }

    .heart-btn, .letter-btn {
      border: none;
      border-radius: 50px;
      padding: clamp(12px, 2.5vw, 16px) clamp(22px, 5vw, 44px);
      font-size: clamp(13px, 3vw, 16px);
      font-weight: 700;
      color: #fff;
      cursor: pointer;
      position: relative;
      overflow: hidden;
      transition: transform 0.2s, box-shadow 0.2s;
      letter-spacing: 1px;
    }

    .heart-btn {
      background: linear-gradient(135deg, var(--pink), var(--purple));
      box-shadow: 0 8px 32px rgba(255, 107, 157, 0.4);
    }

    .letter-btn {
      background: linear-gradient(135deg, #c8a45a, #8b5e1a);
      box-shadow: 0 8px 32px rgba(139, 94, 26, 0.45);
    }

    .heart-btn::before, .letter-btn::before {
      content: '';
      position: absolute;
      inset: 0;
      background: linear-gradient(135deg, rgba(255,255,255,0.2), transparent);
      opacity: 0;
      transition: opacity 0.2s;
    }

    .heart-btn:hover::before, .heart-btn:active::before,
    .letter-btn:hover::before, .letter-btn:active::before { opacity: 1; }

    .heart-btn:active, .letter-btn:active { transform: scale(0.96); }

    .heart-btn:hover {
      transform: scale(1.05);
      box-shadow: 0 12px 48px rgba(255, 107, 157, 0.6);
    }
    .letter-btn:hover {
      transform: scale(1.05);
      box-shadow: 0 12px 48px rgba(139, 94, 26, 0.65);
    }

    /* ── 漂浮爱心 ── */
    .floating-hearts {
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 20;
      overflow: hidden;
    }

    .fheart {
      position: absolute;
      bottom: -60px;
      font-size: var(--size, 24px);
      left: var(--left, 50%);
      animation: heartFloat var(--dur, 4s) var(--delay, 0s) ease-out forwards;
      opacity: 0;
    }

    @keyframes heartFloat {
      0%   { transform: translateY(0) rotate(0deg) scale(0.5); opacity: 0; }
      10%  { opacity: 1; transform: translateY(-60px) rotate(-10deg) scale(1); }
      50%  { opacity: 0.9; transform: translateY(-45vh) rotate(15deg) scale(1.1); }
      100% { opacity: 0; transform: translateY(-100vh) rotate(-20deg) scale(0.8); }
    }

    /* ── 底部文字 ── */
    .footer-text {
      font-size: clamp(11px, 2.5vw, 14px);
      color: rgba(255,255,255,0.25);
      text-align: center;
      margin-top: 10px;
      animation: fadeSlideUp 1s 1s ease both;
      letter-scatter: 1px;
    }

    /* ── 波纹 ── */
    .ripple {
      position: absolute;
      border-radius: 50%;
      background: rgba(255,255,255,0.3);
      transform: scale(0);
      animation: rippleAnim 0.6s linear forwards;
      pointer-events: none;
    }

    @keyframes rippleAnim {
      to { transform: scale(4); opacity: 0; }
    }

    /* ── 烟花 ── */
    .firework-canvas {
      position: fixed;
      inset: 0;
      z-index: 15;
      pointer-events: none;
    }

    /* ── 文字打字 ── */
    .typed-line {
      font-size: clamp(13px, 3vw, 16px);
      color: rgba(255,255,255,0.65);
      text-align: center;
      max-width: 400px;
      line-height: 1.8;
      margin-bottom: 50px;
      min-height: 2em;
      animation: fadeSlideUp 1s 0.3s ease both;
    }

    .cursor-blink {
      display: inline-block;
      width: 2px;
      height: 1.1em;
      background: var(--pink);
      vertical-align: middle;
      margin-left: 2px;
      animation: blink 0.8s step-end infinite;
    }

    /* ── 主页过渡 ── */
    .page {
      transition: opacity 0.8s ease;
    }

    /* ══════════════════════════════════════════
       信件页面（页面流，向下滚动自然到达）
    ══════════════════════════════════════════ */
    #page-letter {
      position: relative;
      z-index: 10;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 60px 20px 80px;
      opacity: 0;
      transition: opacity 1s ease;
    }

    #page-letter.visible {
      opacity: 1;
    }

    /* 羊皮纸 */
    .letter-paper {
      position: relative;
      max-width: 540px;
      width: 100%;
      padding: clamp(32px,6vw,56px) clamp(28px,6vw,52px) clamp(40px,7vw,64px);
      border-radius: 3px;
      background-image:
        repeating-linear-gradient(
          transparent, transparent 31px,
          rgba(139,90,43,0.13) 31px, rgba(139,90,43,0.13) 32px
        ),
        linear-gradient(165deg, #fef8e4 0%, #f5e4a8 50%, #ecdfa0 100%);
      box-shadow:
        0 2px 4px rgba(101,67,33,0.2),
        0 10px 30px rgba(0,0,0,0.45),
        0 30px 70px rgba(0,0,0,0.3),
        inset 0 0 60px rgba(139,90,43,0.07);
      line-height: 32px;
      transform: translateY(100px) rotate(3deg) scale(0.94);
      opacity: 0;
      transition: transform 1.3s cubic-bezier(.22,1,.36,1), opacity 1.3s ease;
    }

    .letter-paper.fly-in {
      transform: translateY(0) rotate(0deg) scale(1);
      opacity: 1;
    }

    /* 左侧装饰红线 */
    .letter-paper::before {
      content: '';
      position: absolute;
      left: clamp(52px,11vw,76px);
      top: 0; bottom: 0;
      width: 1px;
      background: rgba(180,60,60,0.25);
    }

    /* 羽毛笔 */
    .letter-quill {
      text-align: center;
      font-size: clamp(40px,10vw,56px);
      margin-bottom: 6px;
      display: block;
      filter: drop-shadow(0 4px 8px rgba(100,60,0,0.35));
      animation: quillFloat 3.5s ease-in-out infinite;
      transform-origin: bottom center;
    }

    @keyframes quillFloat {
      0%,100% { transform: rotate(-8deg) translateY(0); }
      50%      { transform: rotate(6deg) translateY(-8px); }
    }

    /* 标题 */
    .letter-title {
      font-family: STKaiti, KaiTi, 'Kaiti SC', FangSong, STFangsong, serif;
      font-size: clamp(20px,5vw,28px);
      color: #4a2000;
      text-align: center;
      margin-bottom: 4px;
      text-shadow: 1px 1px 0 rgba(139,90,43,0.2);
    }

    /* 日期 */
    .letter-date {
      font-size: clamp(11px,2.5vw,13px);
      color: #8b6040;
      text-align: right;
      margin-bottom: 20px;
      font-style: italic;
    }

    /* 分割线 */
    .letter-divider {
      border: none;
      border-top: 1px dashed rgba(139,90,43,0.3);
      margin: 0 0 20px;
    }

    /* 正文 */
    .letter-body {
      font-family: STKaiti, KaiTi, 'Kaiti SC', FangSong, STFangsong, serif;
      color: #3b1a00;
      font-size: clamp(15px,3.5vw,18px);
    }

    .letter-greeting {
      margin-bottom: 16px;
      opacity: 0;
      transform: translateY(8px);
      transition: opacity 0.7s ease, transform 0.7s ease;
    }

    .letter-para {
      margin-bottom: 18px;
      text-indent: 2em;
      opacity: 0;
      transform: translateY(8px);
      transition: opacity 0.7s ease, transform 0.7s ease;
    }

    .letter-greeting.reveal, .letter-para.reveal {
      opacity: 1;
      transform: translateY(0);
    }

    /* 落款 */
    .letter-footer {
      display: flex;
      justify-content: space-between;
      align-items: flex-end;
      margin-top: 24px;
      opacity: 0;
      transform: translateY(8px);
      transition: opacity 0.7s ease, transform 0.7s ease;
    }

    .letter-footer.reveal {
      opacity: 1;
      transform: translateY(0);
    }

    .letter-closing {
      font-family: STKaiti, KaiTi, 'Kaiti SC', FangSong, STFangsong, serif;
      font-size: clamp(13px,3vw,16px);
      color: #5c2800;
      text-align: right;
      flex: 1;
    }

    /* 封蜡印章 */
    .letter-seal {
      width: clamp(52px,12vw,68px);
      height: clamp(52px,12vw,68px);
      border-radius: 50%;
      background: radial-gradient(circle at 35% 30%, #e05050, #8b1a1a);
      box-shadow: 0 3px 12px rgba(139,26,26,0.5), inset 0 1px 3px rgba(255,255,255,0.15);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: clamp(24px,5vw,32px);
      flex-shrink: 0;
      margin-left: 16px;
      transform: rotate(-12deg);
      animation: sealPulse 4s ease-in-out infinite;
    }

    @keyframes sealPulse {
      0%,100% { box-shadow: 0 3px 12px rgba(139,26,26,0.5), inset 0 1px 3px rgba(255,255,255,0.15); }
      50%      { box-shadow: 0 3px 20px rgba(200,40,40,0.7), inset 0 1px 3px rgba(255,255,255,0.15); }
    }

    /* 附言 */
    .letter-ps {
      font-family: STKaiti, KaiTi, 'Kaiti SC', FangSong, STFangsong, serif;
      font-size: clamp(12px,2.5vw,14px);
      color: #7a4010;
      margin-top: 18px;
      font-style: italic;
      opacity: 0;
      transform: translateY(8px);
      transition: opacity 0.7s ease, transform 0.7s ease;
    }

    .letter-ps.reveal {
      opacity: 1;
      transform: translateY(0);
    }

    /* 返回提示 */
    @keyframes hintBounce {
      0%,100% { opacity: 0.35; }
      50%      { opacity: 0.85; }
    }

    .handle-hint {
      animation: hintBounce 2s ease-in-out infinite;
    }
    /* ══════════════════════════════════════════
       锁屏密码层
    ══════════════════════════════════════════ */
    #lock-overlay {
      position: fixed;
      inset: 0;
      z-index: 200;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: clamp(20px, 5vw, 32px);
      background: linear-gradient(180deg, var(--sky-top, #060612) 0%, var(--sky-bot, #0a0820) 100%);
      transition: opacity 0.9s ease;
    }

    #lock-overlay.unlocked {
      opacity: 0;
      pointer-events: none;
    }

    .lock-icon {
      font-size: clamp(44px, 12vw, 64px);
      animation: float 3s ease-in-out infinite;
      filter: drop-shadow(0 0 18px rgba(196,77,255,0.5));
    }

    .lock-title {
      font-size: clamp(15px, 4vw, 20px);
      color: rgba(255,255,255,0.65);
      letter-spacing: 4px;
    }

    .pin-row {
      display: flex;
      gap: clamp(8px, 2.5vw, 14px);
    }

    .pin-box {
      width: clamp(42px, 12vw, 58px);
      height: clamp(42px, 12vw, 58px);
      border-radius: 14px;
      background: rgba(255,255,255,0.06);
      border: 1.5px solid rgba(255,255,255,0.15);
      font-size: clamp(20px, 5.5vw, 30px);
      font-weight: 700;
      color: #fff;
      text-align: center;
      caret-color: transparent;
      outline: none;
      backdrop-filter: blur(8px);
      transition: border-color 0.2s, box-shadow 0.2s;
      /* 隐藏浏览器自带密码眼睛图标 */
      -webkit-text-security: disc;
    }

    /* Firefox 不支持 -webkit-text-security，用 type=password 覆盖 */
    .pin-box::-ms-reveal,
    .pin-box::-ms-clear { display: none; }

    .pin-box:focus {
      border-color: rgba(196,77,255,0.7);
      box-shadow: 0 0 0 3px rgba(196,77,255,0.18), 0 0 16px rgba(196,77,255,0.25);
    }

    .pin-row.shake {
      animation: pinShake 0.45s ease;
    }

    @keyframes pinShake {
      0%,100% { transform: translateX(0); }
      15%     { transform: translateX(-10px); }
      35%     { transform: translateX(10px); }
      55%     { transform: translateX(-7px); }
      75%     { transform: translateX(7px); }
    }

    .lock-error {
      font-size: clamp(12px, 3vw, 14px);
      color: var(--pink);
      letter-spacing: 1px;
      opacity: 0;
      transition: opacity 0.3s;
      height: 1.4em;
    }

    .lock-error.show { opacity: 1; }

    .lock-hint {
      font-size: clamp(10px, 2.5vw, 12px);
      color: rgba(255,255,255,0.2);
      letter-spacing: 2px;
    }
  </style>
</head>
<body>

<!-- ══ 锁屏层 ══ -->
<div id="lock-overlay">
  <div class="lock-icon">🔒</div>
  <div class="lock-title">请输入访问密码</div>
  <div class="pin-row" id="pin-row">
    <input class="pin-box" type="password" inputmode="numeric" maxlength="1" pattern="[0-9]" autocomplete="off">
    <input class="pin-box" type="password" inputmode="numeric" maxlength="1" pattern="[0-9]" autocomplete="off">

<script>
// ── 起始时间 ──
const START_DATE = new Date('2026-02-18T00:00:00');

// ────────────────────────────────────────────────────────────
// 昼夜背景主题
// ────────────────────────────────────────────────────────────
const PHASES = [
  // h=小时(0-24), top/bot=天空渐变色, stars=星星可见度, icon=中心图标, c1/c2/c3=光晕颜色
  { h:  0.0, top:'#060612', bot:'#0a0820', stars:1.0, icon:'🌙', c1:'#ff6b9d', c2:'#c44dff', c3:'#4d79ff', label:'深夜' },
  { h:  5.0, top:'#130828', bot:'#241040', stars:0.9, icon:'🌙', c1:'#9c27b0', c2:'#7b1fa2', c3:'#4a148c', label:'黎明前' },
  { h:  6.0, top:'#7b2d52', bot:'#d4612e', stars:0.2, icon:'🌅', c1:'#ff9800', c2:'#ff5722', c3:'#e91e63', label:'日出' },
  { h:  7.5, top:'#2563a8', bot:'#5ba3d0', stars:0.0, icon:'☀️', c1:'#ffd700', c2:'#ff9800', c3:'#ffe082', label:'清晨' },
  { h: 11.0, top:'#0d47a1', bot:'#1976d2', stars:0.0, icon:'☀️', c1:'#ffd700', c2:'#ffeb3b', c3:'#fff9c4', label:'正午' },
  { h: 14.5, top:'#0277bd', bot:'#039be5', stars:0.0, icon:'⛅', c1:'#ffd700', c2:'#ff9800', c3:'#ffe082', label:'下午' },
  { h: 17.0, top:'#c04000', bot:'#e8820c', stars:0.0, icon:'🌇', c1:'#ff5722', c2:'#f57c00', c3:'#ff9800', label:'傍晚' },
  { h: 18.5, top:'#5d1280', bot:'#a0143c', stars:0.3, icon:'🌆', c1:'#e040fb', c2:'#f06292', c3:'#ce93d8', label:'黄昏' },
  { h: 20.0, top:'#180a2e', bot:'#0c0a1a', stars:0.8, icon:'🌙', c1:'#ff6b9d', c2:'#c44dff', c3:'#4d79ff', label:'入夜' },
  { h: 22.0, top:'#060612', bot:'#0a0820', stars:1.0, icon:'🌙', c1:'#ff6b9d', c2:'#c44dff', c3:'#4d79ff', label:'深夜' },
  { h: 24.0, top:'#060612', bot:'#0a0820', stars:1.0, icon:'🌙', c1:'#ff6b9d', c2:'#c44dff', c3:'#4d79ff', label:'深夜' },
];

function hexToRgb(hex) {
  return [
    parseInt(hex.slice(1,3), 16),
    parseInt(hex.slice(3,5), 16),
    parseInt(hex.slice(5,7), 16),
  ];
}
function rgbToHex(r, g, b) {
  return '#' + [r, g, b].map(v => Math.round(Math.min(255, Math.max(0, v))).toString(16).padStart(2,'0')).join('');
}
function lerpColor(c1, c2, t) {
  const [r1,g1,b1] = hexToRgb(c1), [r2,g2,b2] = hexToRgb(c2);
  return rgbToHex(r1+(r2-r1)*t, g1+(g2-g1)*t, b1+(b2-b1)*t);
}
function lerpNum(a, b, t) { return a + (b - a) * t; }

function applyTheme() {
  const now = new Date();
  const h = now.getHours() + now.getMinutes() / 60;

  // 找到当前所处的两个相邻阶段
  let from = PHASES[PHASES.length - 2], to = PHASES[PHASES.length - 1];
  for (let i = 0; i < PHASES.length - 1; i++) {
    if (h >= PHASES[i].h && h < PHASES[i+1].h) {
      from = PHASES[i]; to = PHASES[i+1]; break;
    }
  }
  const t = (h - from.h) / (to.h - from.h);

  const root = document.documentElement.style;
  root.setProperty('--sky-top',   lerpColor(from.top, to.top, t));
  root.setProperty('--sky-bot',   lerpColor(from.bot, to.bot, t));
  root.setProperty('--stars-op',  lerpNum(from.stars, to.stars, t).toFixed(3));
  root.setProperty('--theme-c1',  lerpColor(from.c1, to.c1, t));
  root.setProperty('--theme-c2',  lerpColor(from.c2, to.c2, t));
  root.setProperty('--theme-c3',  lerpColor(from.c3, to.c3, t));

  // 更新中心图标
  const moon = document.querySelector('.moon-emoji');
  if (moon && moon.textContent !== from.icon) moon.textContent = from.icon;

  // 更新时间标签
  const lbl = document.getElementById('time-label');
  if (lbl) lbl.textContent = from.label;
}

applyTheme();
setInterval(applyTheme, 60000); // 每分钟平滑更新一次

// ── 打字机文案 ──
const SENTENCES = [
  '有你的每一天，都格外闪光 ✨',
  '认识你，是今年最好的事 🌙',
  '一个月了，期待更多的月份 🌸',

// ────────────────────────────────────────────────────────────
// 星空 + 流星
// ────────────────────────────────────────────────────────────
function createStars() {
  const container = document.getElementById('stars-container');
  const COUNT = window.innerWidth < 480 ? 80 : 160;

  for (let i = 0; i < 6; i++) {

    m.style.cssText = `

createStars();

// ────────────────────────────────────────────────────────────
// 粒子画布
// ────────────────────────────────────────────────────────────
(function initParticles() {
  const canvas = document.getElementById('particle-canvas');
  const ctx = canvas.getContext('2d');
  let W, H, particles = [];

  function resize() {
    W = canvas.width = window.innerWidth;
    H = canvas.height = window.innerHeight;
  }
  resize();
  window.addEventListener('resize', resize);

  const COLORS = ['#ff6b9d','#c44dff','#4d79ff','#ffd700','#ff9f43'];
  const COUNT = window.innerWidth < 480 ? 40 : 80;

  for (let i = 0; i < COUNT; i++) {
    particles.push({
      x: Math.random() * window.innerWidth,
      y: Math.random() * window.innerHeight,
      r: 1 + Math.random() * 2,
      vx: (Math.random() - 0.5) * 0.4,
      vy: (Math.random() - 0.5) * 0.4,
      color: COLORS[Math.floor(Math.random() * COLORS.length)],
      alpha: 0.3 + Math.random() * 0.5,
    });
  }

  function draw() {
    ctx.clearRect(0, 0, W, H);
    particles.forEach(p => {
      p.x += p.vx; p.y += p.vy;
      if (p.x < 0) p.x = W; if (p.x > W) p.x = 0;
      if (p.y < 0) p.y = H; if (p.y > H) p.y = 0;
      ctx.beginPath();
      ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
      ctx.fillStyle = p.color;
      ctx.globalAlpha = p.alpha;
      ctx.fill();
    });
    ctx.globalAlpha = 1;

    // 连线
    for (let i = 0; i < particles.length; i++) {
      for (let j = i + 1; j < particles.length; j++) {
        const dx = particles[i].x - particles[j].x;
        const dy = particles[i].y - particles[j].y;
        const dist = Math.sqrt(dx*dx + dy*dy);
        if (dist < 100) {
          ctx.beginPath();
          ctx.moveTo(particles[i].x, particles[i].y);
          ctx.lineTo(particles[j].x, particles[j].y);
          ctx.strokeStyle = '#ffffff';
          ctx.globalAlpha = 0.04 * (1 - dist/100);
          ctx.lineWidth = 0.8;
          ctx.stroke();
        }
      }
    }
    ctx.globalAlpha = 1;
    requestAnimationFrame(draw);
  }
  draw();
})();

// ────────────────────────────────────────────────────────────
// 计时器
// ────────────────────────────────────────────────────────────
function pad(n) { return String(n).padStart(2, '0'); }

// 月份计算：每到18号算新的一个月，不按30天
function calcElapsed(start, now) {
  let months = 0;
  let boundary = new Date(start); // 上一个"月份边界"
  while (true) {
    const next = new Date(boundary);
    next.setMonth(next.getMonth() + 1);
    if (next > now) break;
    boundary = next;
    months++;
  }
  const remainMs = now - boundary;
  const totalSec = Math.floor(remainMs / 1000);
  return {
    months,
    days:    Math.floor(totalSec / 86400),
    hours:   Math.floor((totalSec % 86400) / 3600),
    minutes: Math.floor((totalSec % 3600) / 60),
    seconds: totalSec % 60,
    totalDays:  Math.floor((now - start) / 86400000),
    totalHours: Math.floor((now - start) / 3600000),
    totalMins:  Math.floor((now - start) / 60000),
    totalSecs:  Math.floor((now - start) / 1000),
  };
}

function updateTimer() {
  const now = new Date();
  if (now < START_DATE) return;
  const e = calcElapsed(START_DATE, now);

  document.getElementById('t-months').textContent  = pad(e.months);
  document.getElementById('t-days').textContent    = pad(e.days);
  document.getElementById('t-hours').textContent   = pad(e.hours);
  document.getElementById('t-minutes').textContent = pad(e.minutes);
  document.getElementById('t-seconds').textContent = pad(e.seconds);

  document.getElementById('c-days').textContent     = e.totalDays + ' 天';
  document.getElementById('c-hours-val').textContent = e.totalHours + ' 时';
  document.getElementById('c-mins-val').textContent  = e.totalMins.toLocaleString() + ' 分';
  document.getElementById('c-secs-val').textContent  = e.totalSecs.toLocaleString() + ' 秒';
}
updateTimer();
setInterval(updateTimer, 1000);

// ────────────────────────────────────────────────────────────
// 打字机
// ────────────────────────────────────────────────────────────
(function typewriter() {
  const el = document.getElementById('typed-line');
  let si = 0, ci = 0, deleting = false, wait = 0;

  function tick() {
    const sentence = SENTENCES[si];
    if (wait > 0) { wait--; setTimeout(tick, 80); return; }

    if (!deleting) {
      el.innerHTML = sentence.slice(0, ci + 1) + '<span class="cursor-blink"></span>';
      ci++;
      if (ci === sentence.length) { deleting = true; wait = 30; }
      setTimeout(tick, 90);
    } else {
      el.innerHTML = sentence.slice(0, ci) + '<span class="cursor-blink"></span>';
      ci--;
      if (ci < 0) {
        deleting = false;
        ci = 0;
        si = (si + 1) % SENTENCES.length;
        wait = 8;
      }
      setTimeout(tick, 45);
    }
  }
  setTimeout(tick, 1200);
})();

// ────────────────────────────────────────────────────────────
// 漂浮爱心
// ────────────────────────────────────────────────────────────
const HEART_EMOJIS = ['❤️','🧡','💛','💚','💙','💜','🩷','🤍','💖','💗','💝','✨','🌸','⭐'];

function launchHearts(btn) {
  const container = document.getElementById('hearts-container');
  const count = 18;
  for (let i = 0; i < count; i++) {
    const h = document.createElement('div');
    h.className = 'fheart';
    h.textContent = HEART_EMOJIS[Math.floor(Math.random() * HEART_EMOJIS.length)];
    h.style.cssText = `
      --left:${5 + Math.random() * 90}%;
      --size:${16 + Math.random() * 24}px;
      --dur:${3 + Math.random() * 3}s;
      --delay:${Math.random() * 0.8}s;
    `;
    container.appendChild(h);
    h.addEventListener('animationend', () => h.remove());
  }

  // 波纹
  const ripple = document.createElement('div');
  ripple.className = 'ripple';
  const rect = btn.getBoundingClientRect();
  const size = Math.max(rect.width, rect.height);
  ripple.style.cssText = `
    width:${size}px; height:${size}px;
    left:${(rect.width-size)/2}px;
    top:${(rect.height-size)/2}px;
  `;
  btn.style.position = 'relative';
  btn.appendChild(ripple);
  ripple.addEventListener('animationend', () => ripple.remove());

  // 烟花
  launchFirework();
}

// ────────────────────────────────────────────────────────────
// 烟花
// ────────────────────────────────────────────────────────────
(function initFirework() {
  const canvas = document.getElementById('firework-canvas');
  const ctx = canvas.getContext('2d');
  let W, H;
  const fireworks = [];

  function resize() {
    W = canvas.width = window.innerWidth;
    H = canvas.height = window.innerHeight;
  }
  resize();
  window.addEventListener('resize', resize);

  class Particle {
    constructor(x, y, color) {
      this.x = x; this.y = y;
      const angle = Math.random() * Math.PI * 2;
      const speed = 2 + Math.random() * 5;
      this.vx = Math.cos(angle) * speed;
      this.vy = Math.sin(angle) * speed;
      this.alpha = 1;
      this.color = color;
      this.r = 2 + Math.random() * 2;
      this.decay = 0.015 + Math.random() * 0.01;
    }
    update() {
      this.x += this.vx; this.y += this.vy;
      this.vy += 0.06;
      this.vx *= 0.98; this.vy *= 0.98;
      this.alpha -= this.decay;
    }
    draw() {
      ctx.beginPath();
      ctx.arc(this.x, this.y, this.r, 0, Math.PI * 2);
      ctx.fillStyle = this.color;
      ctx.globalAlpha = Math.max(0, this.alpha);
      ctx.fill();
    }
  }

  const FW_COLORS = ['#ff6b9d','#c44dff','#4d79ff','#ffd700','#ff9f43','#fff','#00ffcc'];

  window.launchFirework = function() {
    const x = W * (0.2 + Math.random() * 0.6);
    const y = H * (0.1 + Math.random() * 0.5);
    const color = FW_COLORS[Math.floor(Math.random() * FW_COLORS.length)];
    const pts = [];
    for (let i = 0; i < 80; i++) pts.push(new Particle(x, y, color));
    fireworks.push(pts);
    if (fireworks.length === 1) loop();
  };

  function loop() {
    ctx.clearRect(0, 0, W, H);
    for (let fi = fireworks.length - 1; fi >= 0; fi--) {
      const pts = fireworks[fi];
      for (let pi = pts.length - 1; pi >= 0; pi--) {
        pts[pi].update();
        pts[pi].draw();
        if (pts[pi].alpha <= 0) pts.splice(pi, 1);
      }
      if (pts.length === 0) fireworks.splice(fi, 1);
    }
    ctx.globalAlpha = 1;
    if (fireworks.length > 0) requestAnimationFrame(loop);
    else ctx.clearRect(0, 0, W, H);
  }
})();

// 自动烟花（页面加载后）
setTimeout(() => { launchFirework(); }, 1000);
setTimeout(() => { launchFirework(); }, 1800);
setTimeout(() => { launchFirework(); }, 2600);
</script>

<script>
// ────────────────────────────────────────────────────────────
// 信件：渲染内容 + 飘入动画 + 段落逐一显示
// ────────────────────────────────────────────────────────────
(function initLetter() {
  const c = LETTER_CONTENT;
  document.getElementById('letter-title').textContent   = c.title;
  document.getElementById('letter-date').textContent    = c.date;
  document.getElementById('letter-greeting').textContent = c.greeting;
  document.getElementById('letter-closing').textContent = c.closing;

  const parasEl = document.getElementById('letter-paragraphs');
  c.paragraphs.forEach(text => {
    const p = document.createElement('div');
    p.className = 'letter-para';
    p.textContent = text;
    parasEl.appendChild(p);
  });

  if (c.ps) {
    document.getElementById('letter-ps').textContent = c.ps;
  } else {
    document.getElementById('letter-ps').style.display = 'none';
  }
})();

// ────────────────────────────────────────────────────────────
// 信件：滚动渐显 / 逐段显现
// ────────────────────────────────────────────────────────────
const pageHome   = document.querySelector('.page');
const pageLetter = document.getElementById('page-letter');
let   letterAnimated = false;

function revealLetter() {
  if (letterAnimated) return;
  letterAnimated = true;
  const paper = document.getElementById('letter-paper');
  setTimeout(() => paper.classList.add('fly-in'), 200);
  const items = [
    document.getElementById('letter-greeting'),
    ...document.querySelectorAll('.letter-para'),
    document.getElementById('letter-footer'),
    document.getElementById('letter-ps'),
  ];
  items.forEach((el, i) => {
    if (el) setTimeout(() => el.classList.add('reveal'), 1400 + i * 450);
  });
}

function openLetter() {
  pageLetter.scrollIntoView({ behavior: 'smooth' });
}

// IntersectionObserver：信件进入视口 → 渐显动画；离开 → 主页恢复
const observer = new IntersectionObserver(entries => {
  entries.forEach(entry => {
    if (entry.isIntersecting) {
      pageLetter.classList.add('visible');
      pageHome.style.opacity = '0.15';
      revealLetter();
    } else {
      pageLetter.classList.remove('visible');
      pageHome.style.opacity = '1';
    }
  });
}, { threshold: 0.25 });

observer.observe(pageLetter);

// ────────────────────────────────────────────────────────────
// 锁屏密码
// ────────────────────────────────────────────────────────────
(function initLock() {
  const PASSWORD = '260218';
  const overlay  = document.getElementById('lock-overlay');
  const pinRow   = document.getElementById('pin-row');
  const errorEl  = document.getElementById('lock-error');
  const boxes    = Array.from(document.querySelectorAll('.pin-box'));

  // 锁屏期间禁止页面滚动
  document.body.style.overflow = 'hidden';
  setTimeout(() => boxes[0].focus(), 400);

  function getEntered() { return boxes.map(b => b.value).join(''); }

  function wrongPassword() {
    errorEl.classList.add('show');
    pinRow.classList.add('shake');
    setTimeout(() => {
      pinRow.classList.remove('shake');
      boxes.forEach(b => b.value = '');
      errorEl.classList.remove('show');
      boxes[0].focus();
    }, 700);
  }

  function checkPassword() {
    const entered = getEntered();
    if (entered.length < 6) return;
    if (entered === PASSWORD) {
      overlay.classList.add('unlocked');
      document.body.style.overflow = '';
      setTimeout(() => overlay.remove(), 950);
    } else {
      wrongPassword();
    }
  }

  boxes.forEach((box, i) => {
    box.addEventListener('input', () => {
      // 只保留数字且最多1位
      box.value = box.value.replace(/\D/g, '').slice(-1);
      if (box.value && i < 5) boxes[i + 1].focus();
      checkPassword();
    });

    box.addEventListener('keydown', e => {
      if (e.key === 'Backspace') {
        if (!box.value && i > 0) { boxes[i - 1].focus(); boxes[i - 1].value = ''; }
        return;
      }
      // 阻止非数字键（保留功能键）
      if (!/^\d$/.test(e.key) && !['Tab','ArrowLeft','ArrowRight'].includes(e.key)) {
        e.preventDefault();
      }
    });

    // 支持整段粘贴
    box.addEventListener('paste', e => {
      e.preventDefault();
      const digits = (e.clipboardData.getData('text') || '').replace(/\D/g, '').slice(0, 6);
      digits.split('').forEach((d, idx) => { if (boxes[idx]) boxes[idx].value = d; });
      boxes[Math.min(digits.length, 5)].focus();
      checkPassword();
    });

    // 点击已填框时清空以便重新输入
    box.addEventListener('click', () => { box.value = ''; });
  });
})();
</script>
</body>
</html>
